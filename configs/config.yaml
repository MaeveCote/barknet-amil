# =============================================================================
# barknet-AMIL — configuration
# ConvNeXt-V2 backbone + attention-based MIL over within-image bark patches.
# =============================================================================

project:
  name: barknet-amil
  seed: 42
  device: cuda:0              # cuda:0 | cpu

data:
  patch_root: ./data/barknet_patches/train # Root to the patches train data
  num_workers: 5
  prefetch_factor: 4

  # Runtime tree-level split out of the single patch_root above (no test/ folder needed).
  #   test_ratio: 0    -> legacy behaviour: train/val only, test comes from test.data_root
  #   test_ratio: 0.2  -> 20% of the trees per class are held out as test
  #   n_folds: 5       -> k-fold CV; fold_index selects which fold is the test set
  #                       (overrides test_ratio when set)
  split:
    test_ratio: 0.0
    n_folds: null
    fold_index: 0
  val_ratio: 0.15  # fraction of the NON-test trees held out for validation
  max_patches_per_bag: 128  # keep equal to the value the Stage-2 search used

  # The 23 barknet 1.0 species codes (folder names). Trim to the classes you
  # actually train on; (ERB, PEG, PID) were dropped in the original barknet paper.
  species:
    [BOJ, BOP, CHR, EPB, EPN, EPO, EPR, ERR, ERS, FRA, HEG,
     MEL, ORA, OSV, PET, PIB, PIR, PRU, SAB, THO]
  #    [BOJ, BOP, CHR, EPB, EPN, EPO, EPR, ERB, ERR, ERS, FRA, HEG,
  #     MEL, ORA, OSV, PEG, PET, PIB, PID, PIR, PRU, SAB, THO]

  # How to parse ids from a patch filename, e.g. "<tree>_<image>_<patch>.png".
  # tree_id_index drives the leakage-safe split; image_id_index defines the bag.
  filename:
    delimiter: "_"
    tree_id_index: 0
    image_id_index: 1

model:
  size: nano # atto | femto | pico | nano | tiny | base  (there is no convnextv2_small)
  weights: default # default (ImageNet-pretrained) | none (from scratch)
  pretrained_checkpoint: null # optional .pth to resume a full AMIL model
  # Stage-1 backbone used to initialise Stage-2 (set null to skip two-stage training).
  backbone_checkpoint: ./runs/pretrain/best_backbone.pth
  attn_dropout: 0.1
  class_dropout: 0.4
  drop_path_rate: 0.2
  label_smoothing: 0.1 # 0 disables

# Stage 1: patch-level backbone pretraining (per-patch classifier).
pretrain:
  optimal_params: null      # tuned values inlined below (the tune YAML doesn't exist locally)
  epochs: 40
  batch_size: 128           # tuned Pico@224 value
  warmup_ratio: 0.16
  base_lr: 1.0062785194709649e-4   # tuned Pico@224 (Stage-1 / from-ImageNet rate)
  weight_decay: 1.031294766456457e-3
  class_dropout: 0.11410614649915582
  drop_path_rate: 0.25703944838962833
  min_epochs: 15            # early-stopping floor (must clear warmup)
  early_stopping_patience: 10
  # val_loss | val_acc -- they disagree on this dataset (label smoothing pushes val loss
  # up while val acc still climbs). Pick one and use it for every fold.
  checkpoint_metric: val_acc
  resume: false # resume from best_backbone.pth in output_dir
  output_dir: ./runs/pretrain

# Stage 2: image-level AMIL fine-tuning (loads the Stage-1 backbone).
train:
  epochs: 15
  warmup_ratio: 0.2
  accumulation_steps: 32          # tuned Stage-2 value
  instance_loss_weight: 0.6412880283086111
  attn_dropout: 0.41876045365913256
  class_dropout: 0.20525668127122992
  base_lr: 1.0337768182267276e-5  # tuned Stage-2 (fine-tune-an-existing-backbone rate)
  weight_decay: 6.418189515676058e-4
  lr_multiplier: 15
  min_epochs: 5
  early_stopping_patience: 5
  save_epoch_states: false
  output_dir: ./runs/train
  optimal_params: null            # tuned values inlined above
  optimizer:
    base_lr: null
    weight_decay: null
    lr_multiplier: null

tune:
  stage: board # pretrain | board — which one runs when no --stage flag is given
  output_dir: ./runs/tune

  pretrain:
    trials: 3
    epoch_limit: 5
    train_subset_ratio: 0.02
    val_subset_ratio: 0.06
    min_val_images_per_class: 1
    batch_size_choices: [16, 32, 64]

  board:
    trials: 3
    epoch_limit: 3
    train_subset_ratio: 0.01

test:
  checkpoint: ./runs/train/best_model.pth
  # Legacy pre-cut test folder. Set to null to use the runtime data.split holdout instead.
  data_root: ./data/barknet_patches/test
  chunk_size: 64            # patches per forward chunk at inference (bounds peak VRAM)
  max_patches_per_bag: null # null = evaluate on the FULL bag
  output_dir: ./runs/test

augmentation:
  # Applied per patch at load time. Patches are pre-cut squares, so we Resize to
  # the backbone input rather than RandomResizedCrop-upscaling.
  input_size: 224
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation:
    prob: 0.5
    degrees: 15
  color_jitter:
    prob: 0.5
    brightness: 0.3
    contrast: 0.3
    saturation: 0.25
    hue: 0.05
  gaussian_blur:
    prob: 0.2
    kernel_size: 5
  random_erasing: # Cutout, sized as a fraction of patch area
    prob: 0.5
    scale: [0.02, 0.06]
    count: 2
  normalize:
    # Statistics computed on the BarkNet 1.0 patches.
    mean:  [0.4873, 0.4891, 0.4457]
    std: [0.1988, 0.1965, 0.2132]
